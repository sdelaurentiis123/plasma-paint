[project]
name = "plasma-paint-gym"
version = "0.1.0"
description = "Local-only single-frame plasma painting interaction environment."
requires-python = ">=3.11"
dependencies = ["verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@25debce78aff23fca201cefe9c6f72dc65176d06", "plasma-painter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plasma_paint_gym"]
